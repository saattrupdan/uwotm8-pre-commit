[project]
name = "uwotm8-pre-commit"
version = "0.0.3"
description = "A pre-commit hook wrapper for uwotm8 - converts American English to British English"
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "Dan Saattrup Smart", email = "saattrupdan@gmail.com" },
]
maintainers = [
  { name = "Dan Saattrup Smart", email = "saattrupdan@gmail.com" },
]
keywords = [
  "pre-commit",
  "uwotm8",
  "british-english",
  "american-english",
  "spelling",
  "gds",
]
license = { text = "MIT" }
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
dependencies = [
  "uwotm8>=0.1.0",
]


[dependency-groups]
dev = [
  "pre-commit>=3.0.0",
]

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = [
    ".git",
    ".pytest_cache",
    ".ruff_cache",
    ".euroeval_cache",
    ".venv",
]
extend-include = [
    "*.ipynb",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = [
    # Imports
    "I",
    "PLC0415",
    # Docstrings
    "D",
    "DOC",
    # pycodestyle errors and warnings (PEP8)
    "E",
    "W",
    # flake-annotations (type hints)
    "ANN",
    # Pyflakes
    "F",
]
ignore = [
    # Type annotations for *args
    "ANN002",
    # Type annotations for **kwargs
    "ANN003",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
